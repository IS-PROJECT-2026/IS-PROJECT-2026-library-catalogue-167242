<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Library Catalogue</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <h1>Library Catalogue</h1>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Books</a>
            <a href="#">Categories</a>
            <a href="#">Borrowing</a>
        </nav>

    </header>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main>

        <!-- =====================================
             SEARCH AND FILTER SECTION
        ====================================== -->

        <section class="search-section">

            <h2>Search Books</h2>

            <!-- Search input -->

            <input
                type="text"
                id="searchInput"
                placeholder="Search by title or author..."
            >

            <!-- Search button -->

            <button id="searchButton">
                Search
            </button>

            <br>
            <br>

            <!-- Category filter -->

            <label for="categoryFilter">
                Filter by Category:
            </label>

            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="African Literature">
                    African Literature
                </option>

                <option value="Programming">
                    Programming
                </option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Fiction">
                    Fiction
                </option>

                <option value="Self Development">
                    Self Development
                </option>

            </select>


            <!-- Search results -->

            <div id="searchResults">

                <p>
                    Enter a book title or author to search.
                </p>

            </div>

        </section>


        <!-- =====================================
             DASHBOARD
        ====================================== -->

        <section class="dashboard">

            <h2>Library Dashboard</h2>

            <div class="dashboard-cards">

                <!-- Total books -->

                <div class="card">

                    <h3>
                        Total Books
                    </h3>

                    <p id="totalBooks">
                        0
                    </p>

                </div>


                <!-- Available books -->

                <div class="card">

                    <h3>
                        Available Books
                    </h3>

                    <p id="availableBooks">
                        0
                    </p>

                </div>


                <!-- Borrowed books -->

                <div class="card">

                    <h3>
                        Borrowed Books
                    </h3>

                    <p id="borrowedBooks">
                        0
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script type="module">

        // ========================================
        // IMPORT BOOK DATA
        // ========================================

        import books from "./js/books.js";


        // ========================================
        // GET HTML ELEMENTS
        // ========================================

        const searchInput =
            document.getElementById("searchInput");

        const searchButton =
            document.getElementById("searchButton");

        const categoryFilter =
            document.getElementById("categoryFilter");

        const searchResults =
            document.getElementById("searchResults");

        const totalBooks =
            document.getElementById("totalBooks");

        const availableBooks =
            document.getElementById("availableBooks");

        const borrowedBooks =
            document.getElementById("borrowedBooks");


        // ========================================
        // LOAD BORROWED BOOKS
        // ========================================

        let borrowedBookTitles =
            JSON.parse(
                localStorage.getItem("borrowedBooks")
            ) || [];


        // ========================================
        // APPLY SAVED BORROWING INFORMATION
        // ========================================

        books.forEach(book => {

            if (
                borrowedBookTitles.includes(book.title)
            ) {

                book.available = false;

            }

        });


        // ========================================
        // SAVE BORROWED BOOKS
        // ========================================

        function saveBorrowedBooks() {

            localStorage.setItem(
                "borrowedBooks",
                JSON.stringify(borrowedBookTitles)
            );

        }


        // ========================================
        // UPDATE DASHBOARD
        // ========================================

        function updateDashboard() {

            const total =
                books.length;

            const available =
                books.filter(
                    book => book.available
                ).length;

            const borrowed =
                books.filter(
                    book => !book.available
                ).length;


            totalBooks.textContent =
                total;

            availableBooks.textContent =
                available;

            borrowedBooks.textContent =
                borrowed;

        }


        // ========================================
        // DISPLAY BOOKS
        // ========================================

        function displayBooks(bookList) {

            // No books found

            if (bookList.length === 0) {

                searchResults.innerHTML = `
                    <p>
                        No books found.
                    </p>
                `;

                return;

            }


            // Display books

            searchResults.innerHTML =

                bookList.map(book => `

                    <div class="book-result">

                        <h3>
                            ${book.title}
                        </h3>


                        <p>

                            <strong>
                                Author:
                            </strong>

                            ${book.author}

                        </p>


                        <p>

                            <strong>
                                Category:
                            </strong>

                            ${book.category}

                        </p>


                        <p>

                            <strong>
                                Year:
                            </strong>

                            ${book.year}

                        </p>


                        <p>

                            <strong>
                                Status:
                            </strong>

                            <span class="${
                                book.available
                                    ? "available"
                                    : "borrowed"
                            }">

                                ${
                                    book.available
                                        ? "Available"
                                        : "Borrowed"
                                }

                            </span>

                        </p>


                        ${
                            book.available

                                ? `

                                    <button
                                        class="borrow-button"
                                        data-title="${book.title}"
                                    >
                                        Borrow Book
                                    </button>

                                `

                                : `

                                    <button
                                        class="return-button"
                                        data-title="${book.title}"
                                    >
                                        Return Book
                                    </button>

                                `
                        }

                    </div>

                `).join("");

        }


        // ========================================
        // SEARCH AND CATEGORY FILTER
        // ========================================

        function searchBooks() {

            // Get search term

            const searchTerm =
                searchInput.value
                    .toLowerCase()
                    .trim();


            // Get selected category

            const selectedCategory =
                categoryFilter.value;


            // Filter books

            const filteredBooks =
                books.filter(book => {

                    const matchesTitle =
                        book.title
                            .toLowerCase()
                            .includes(searchTerm);


                    const matchesAuthor =
                        book.author
                            .toLowerCase()
                            .includes(searchTerm);


                    const matchesCategory =
                        selectedCategory === "all"
                        ||
                        book.category === selectedCategory;


                    return (

                        (
                            matchesTitle ||
                            matchesAuthor
                        )

                        &&

                        matchesCategory

                    );

                });


            // Display results

            displayBooks(
                filteredBooks
            );

        }


        // ========================================
        // BORROW BOOK
        // ========================================

        function borrowBook(bookTitle) {

            // Find the selected book

            const book =
                books.find(
                    book =>
                        book.title === bookTitle
                );


            // Make sure book exists

            if (!book) {

                return;

            }


            // Check whether already borrowed

            if (!book.available) {

                alert(
                    "This book has already been borrowed."
                );

                return;

            }


            // Change availability

            book.available = false;


            // Add to borrowed list

            if (
                !borrowedBookTitles.includes(
                    book.title
                )
            ) {

                borrowedBookTitles.push(
                    book.title
                );

            }


            // Save borrowing information

            saveBorrowedBooks();


            // Update dashboard

            updateDashboard();


            // Refresh displayed books

            searchBooks();


            // Confirmation message

            alert(
                `You have borrowed "${book.title}".`
            );

        }


        // ========================================
        // RETURN BOOK
        // ========================================

        function returnBook(bookTitle) {

            // Find the selected book

            const book =
                books.find(
                    book =>
                        book.title === bookTitle
                );


            // Make sure book exists

            if (!book) {

                return;

            }


            // Check whether already available

            if (book.available) {

                alert(
                    "This book is already available."
                );

                return;

            }


            // Change availability

            book.available = true;


            // Remove from borrowed list

            borrowedBookTitles =
                borrowedBookTitles.filter(
                    title =>
                        title !== book.title
                );


            // Save changes

            saveBorrowedBooks();


            // Update dashboard

            updateDashboard();


            // Refresh displayed books

            searchBooks();


            // Confirmation message

            alert(
                `You have returned "${book.title}".`
            );

        }


        // ========================================
        // BOOK BUTTON EVENTS
        // ========================================

        searchResults.addEventListener(
            "click",
            function(event) {

                // Borrow button

                if (
                    event.target.classList.contains(
                        "borrow-button"
                    )
                ) {

                    const bookTitle =
                        event.target.dataset.title;

                    borrowBook(
                        bookTitle
                    );

                }


                // Return button

                if (
                    event.target.classList.contains(
                        "return-button"
                    )
                ) {

                    const bookTitle =
                        event.target.dataset.title;

                    returnBook(
                        bookTitle
                    );

                }

            }
        );


        // ========================================
        // EVENT LISTENERS
        // ========================================


        // Search button

        searchButton.addEventListener(
            "click",
            searchBooks
        );


        // Search while typing

        searchInput.addEventListener(
            "input",
            searchBooks
        );


        // Category filter

        categoryFilter.addEventListener(
            "change",
            searchBooks
        );


        // ========================================
        // INITIAL PAGE LOAD
        // ========================================

        // Display all books

        displayBooks(
            books
        );


        // Update dashboard

        updateDashboard();

    </script>

</body>

</html>
