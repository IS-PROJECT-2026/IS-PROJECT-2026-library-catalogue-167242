```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Library Catalogue</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <h1>Library Catalogue</h1>

        <nav>

            <a href="#">Dashboard</a>

            <a href="#">Books</a>

            <a href="#">Categories</a>

            <a href="#">Borrowing</a>

        </nav>

    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main>


        <!-- =====================================
             SEARCH AND FILTER SECTION
        ====================================== -->

        <section class="search-section">

            <h2>Search Books</h2>


            <!-- Search input -->

            <input
                type="text"
                id="searchInput"
                placeholder="Search by title or author..."
            >


            <!-- Search button -->

            <button
                type="button"
                id="searchButton"
            >
                Search
            </button>


            <br>
            <br>


            <!-- Category filter -->

            <label for="categoryFilter">
                Filter by Category:
            </label>


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="African Literature">
                    African Literature
                </option>

                <option value="Programming">
                    Programming
                </option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Fiction">
                    Fiction
                </option>

                <option value="Self Development">
                    Self Development
                </option>

            </select>


            <!-- Search results -->

            <div id="searchResults">

                <p>
                    Enter a book title or author to search.
                </p>

            </div>

        </section>



        <!-- =====================================
             DASHBOARD
        ====================================== -->

        <section class="dashboard">

            <h2>Library Dashboard</h2>


            <div class="dashboard-cards">


                <!-- Total books -->

                <div class="card">

                    <h3>
                        Total Books
                    </h3>

                    <p id="totalBooks">
                        0
                    </p>

                </div>


                <!-- Available books -->

                <div class="card">

                    <h3>
                        Available Books
                    </h3>

                    <p id="availableBooks">
                        0
                    </p>

                </div>


                <!-- Borrowed books -->

                <div class="card">

                    <h3>
                        Borrowed Books
                    </h3>

                    <p id="borrowedBooks">
                        0
                    </p>

                </div>


                <!-- Borrowed percentage -->

                <div class="card">

                    <h3>
                        Borrowed Percentage
                    </h3>

                    <p id="borrowedPercentage">
                        0%
                    </p>

                </div>


            </div>

        </section>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script type="module">


        // ========================================
        // IMPORT BOOK DATA
        // ========================================

        import books from "./js/books.js";



        // ========================================
        // GET HTML ELEMENTS
        // ========================================

        const searchInput =
            document.getElementById("searchInput");


        const searchButton =
            document.getElementById("searchButton");


        const categoryFilter =
            document.getElementById("categoryFilter");


        const searchResults =
            document.getElementById("searchResults");


        const totalBooks =
            document.getElementById("totalBooks");


        const availableBooks =
            document.getElementById("availableBooks");


        const borrowedBooks =
            document.getElementById("borrowedBooks");


        const borrowedPercentage =
            document.getElementById(
                "borrowedPercentage"
            );



        // ========================================
        // LOAD SAVED BOOK DATA SAFELY
        // ========================================

        function loadBooks() {

            try {

                const savedBooks =
                    localStorage.getItem(
                        "libraryBooks"
                    );


                // No saved data

                if (!savedBooks) {

                    return;

                }


                const savedBooksData =
                    JSON.parse(savedBooks);


                // Make sure saved data is an array

                if (
                    !Array.isArray(
                        savedBooksData
                    )
                ) {

                    return;

                }


                // Replace current data with
                // saved catalogue data

                books.splice(
                    0,
                    books.length,
                    ...savedBooksData
                );


            } catch (error) {

                console.error(
                    "Unable to load saved library data:",
                    error
                );

            }

        }


        // Load saved books

        loadBooks();



        // ========================================
        // SAVE BOOK DATA
        // ========================================

        function saveBooks() {

            try {

                localStorage.setItem(
                    "libraryBooks",
                    JSON.stringify(books)
                );


            } catch (error) {

                console.error(
                    "Unable to save library data:",
                    error
                );

            }

        }



        // ========================================
        // UPDATE CATALOGUE STATISTICS
        // ========================================

        function updateDashboard() {


            // Total books

            const total =
                books.length;


            // Available books

            const available =
                books.filter(
                    book => book.available
                ).length;


            // Borrowed books

            const borrowed =
                books.filter(
                    book => !book.available
                ).length;


            // Borrowed percentage

            const borrowedRate =
                total > 0
                    ? Math.round(
                        (borrowed / total) * 100
                    )
                    : 0;


            // Update dashboard

            totalBooks.textContent =
                total;


            availableBooks.textContent =
                available;


            borrowedBooks.textContent =
                borrowed;


            borrowedPercentage.textContent =
                borrowedRate + "%";

        }



        // ========================================
        // DISPLAY BOOKS
        // ========================================

        function displayBooks(bookList) {


            // No books found

            if (
                bookList.length === 0
            ) {

                searchResults.innerHTML = `

                    <p>
                        No books found.
                    </p>

                `;

                return;

            }



            // Display books

            searchResults.innerHTML =

                bookList.map(book => `

                    <div class="book-result">


                        <h3>
                            ${book.title}
                        </h3>


                        <p>

                            <strong>
                                Author:
                            </strong>

                            ${book.author}

                        </p>


                        <p>

                            <strong>
                                Category:
                            </strong>

                            ${book.category}

                        </p>


                        <p>

                            <strong>
                                Year:
                            </strong>

                            ${book.year}

                        </p>


                        <p>

                            <strong>
                                Status:
                            </strong>


                            <span class="${
                                book.available
                                    ? "available"
                                    : "borrowed"
                            }">

                                ${
                                    book.available
                                        ? "Available"
                                        : "Borrowed"
                                }

                            </span>

                        </p>


                        ${
                            book.available

                                ? `

                                    <button
                                        type="button"
                                        class="borrow-button"
                                        data-id="${book.id}"
                                    >
                                        Borrow Book
                                    </button>

                                `

                                : `

                                    <button
                                        type="button"
                                        class="return-button"
                                        data-id="${book.id}"
                                    >
                                        Return Book
                                    </button>

                                `
                        }


                    </div>

                `).join("");

        }



        // ========================================
        // SEARCH AND CATEGORY FILTER
        // ========================================

        function searchBooks() {


            // Get search term

            const searchTerm =
                searchInput.value
                    .toLowerCase()
                    .trim();


            // Get selected category

            const selectedCategory =
                categoryFilter.value;


            // Filter books

            const filteredBooks =
                books.filter(book => {


                    const title =
                        String(
                            book.title || ""
                        ).toLowerCase();


                    const author =
                        String(
                            book.author || ""
                        ).toLowerCase();


                    // Search by title or author

                    const matchesSearch =
                        title.includes(
                            searchTerm
                        )
                        ||
                        author.includes(
                            searchTerm
                        );


                    // Category filter

                    const matchesCategory =
                        selectedCategory === "all"
                        ||
                        book.category ===
                            selectedCategory;


                    return (
                        matchesSearch
                        &&
                        matchesCategory
                    );

                });


            // Display results

            displayBooks(
                filteredBooks
            );

        }



        // ========================================
        // BORROW BOOK
        // ========================================

        function borrowBook(bookId) {


            // Find book using unique ID

            const book =
                books.find(
                    book =>
                        String(book.id) ===
                        String(bookId)
                );


            // Book not found

            if (!book) {

                alert(
                    "The selected book could not be found."
                );

                return;

            }


            // Already borrowed

            if (!book.available) {

                alert(
                    "This book has already been borrowed."
                );

                return;

            }


            // Change availability

            book.available = false;


            // Save change

            saveBooks();


            // Update dashboard

            updateDashboard();


            // Refresh current results

            searchBooks();


            // Confirmation

            alert(
                `You have borrowed "${book.title}".`
            );

        }



        // ========================================
        // RETURN BOOK
        // ========================================

        function returnBook(bookId) {


            // Find book using unique ID

            const book =
                books.find(
                    book =>
                        String(book.id) ===
                        String(bookId)
                );


            // Book not found

            if (!book) {

                alert(
                    "The selected book could not be found."
                );

                return;

            }


            // Already available

            if (book.available) {

                alert(
                    "This book is already available."
                );

                return;

            }


            // Change availability

            book.available = true;


            // Save change

            saveBooks();


            // Update dashboard

            updateDashboard();


            // Refresh current results

            searchBooks();


            // Confirmation

            alert(
                `You have returned "${book.title}".`
            );

        }



        // ========================================
        // BOOK BUTTON EVENTS
        // ========================================

        searchResults.addEventListener(
            "click",
            function(event) {


                // Find the clicked button

                const button =
                    event.target.closest(
                        "button"
                    );


                // Ignore other clicks

                if (!button) {

                    return;

                }


                // Get book ID

                const bookId =
                    button.dataset.id;


                if (!bookId) {

                    return;

                }


                // Borrow button

                if (
                    button.classList.contains(
                        "borrow-button"
                    )
                ) {

                    borrowBook(
                        bookId
                    );

                    return;

                }


                // Return button

                if (
                    button.classList.contains(
                        "return-button"
                    )
                ) {

                    returnBook(
                        bookId
                    );

                }

            }
        );



        // ========================================
        // SEARCH BUTTON
        // ========================================

        searchButton.addEventListener(
            "click",
            searchBooks
        );



        // ========================================
        // SEARCH WHILE TYPING
        // ========================================

        searchInput.addEventListener(
            "input",
            searchBooks
        );



        // ========================================
        // SEARCH USING ENTER KEY
        // ========================================

        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    searchBooks();

                }

            }
        );



        // ========================================
        // CATEGORY FILTER
        // ========================================

        categoryFilter.addEventListener(
            "change",
            searchBooks
        );



        // ========================================
        // INITIAL PAGE LOAD
        // ========================================

        displayBooks(
            books
        );


        updateDashboard();


    </script>


</body>

</html>
```
