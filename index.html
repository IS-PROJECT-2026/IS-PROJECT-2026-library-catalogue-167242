<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Catalogue</title>

    <style>

        /* ==============================
           GENERAL PAGE STYLING
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }


        /* ==============================
           HEADER
        ============================== */

        header {
            background-color: #245783;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 20px 0;
            font-size: 40px;
        }


        /* ==============================
           NAVIGATION
        ============================== */

        nav {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* ==============================
           MAIN CONTENT
        ============================== */

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }


        /* ==============================
           SEARCH SECTION
        ============================== */

        .search-section {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 35px;
        }

        .search-section h2 {
            color: #245783;
            margin-top: 0;
            font-size: 32px;
        }


        /* Search area */

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        #searchInput {
            flex: 1;
            padding: 15px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        #searchButton {
            padding: 15px 30px;
            background-color: #245783;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #173e5f;
        }


        /* ==============================
           CATEGORY FILTER
        ============================== */

        .category-filter {
            margin-bottom: 25px;
        }

        .category-filter label {
            font-weight: bold;
            margin-right: 10px;
        }

        #categoryFilter {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }


        /* ==============================
           BOOK RESULTS
        ============================== */

        #searchResults {
            margin-top: 20px;
        }

        .book-result {
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .book-result h3 {
            color: #245783;
            margin-top: 0;
            font-size: 24px;
        }

        .book-result p {
            margin: 10px 0;
            font-size: 16px;
        }


        /* ==============================
           DASHBOARD
        ============================== */

        .dashboard {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .dashboard h2 {
            color: #245783;
            font-size: 32px;
            margin-top: 0;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: #f4f6f8;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
        }

        .card h3 {
            color: #245783;
            margin-top: 0;
        }

        .card p {
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 0;
        }


        /* ==============================
           NO RESULTS MESSAGE
        ============================== */

        .no-results {
            padding: 20px;
            background-color: #fff3f3;
            border: 1px solid #e0aaaa;
            border-radius: 8px;
            color: #9b2226;
        }


        /* ==============================
           RESPONSIVE DESIGN
        ============================== */

        @media (max-width: 768px) {

            header h1 {
                font-size: 30px;
            }

            nav {
                gap: 15px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }

            .dashboard-cards {
                grid-template-columns: 1fr;
            }

            .search-section,
            .dashboard {
                padding: 20px;
            }
        }

    </style>

</head>


<body>


    <!-- ==============================
         HEADER AND NAVIGATION
    ============================== -->

    <header>

        <h1>Library Catalogue</h1>

        <nav>

            <a href="#dashboard">
                Dashboard
            </a>

            <a href="#books">
                Books
            </a>

            <a href="#categories">
                Categories
            </a>

            <a href="#borrowing">
                Borrowing
            </a>

        </nav>

    </header>


    <!-- ==============================
         MAIN CONTENT
    ============================== -->

    <main>


        <!-- ==============================
             SEARCH AND FILTER SECTION
        ============================== -->

        <section class="search-section" id="books">

            <h2>Search Books</h2>


            <!-- Search box -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by title or author..."
                >

                <button id="searchButton">
                    Search
                </button>

            </div>


            <!-- Category filter -->

            <div class="category-filter" id="categories">

                <label for="categoryFilter">
                    Filter by Category:
                </label>

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="African Literature">
                        African Literature
                    </option>

                    <option value="Fiction">
                        Fiction
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Science">
                        Science
                    </option>

                </select>

            </div>


            <!-- Search results -->

            <div id="searchResults"></div>

        </section>



        <!-- ==============================
             DASHBOARD
        ============================== -->

        <section class="dashboard" id="dashboard">

            <h2>
                Library Dashboard
            </h2>


            <div class="dashboard-cards">


                <!-- Total books -->

                <div class="card">

                    <h3>
                        Total Books
                    </h3>

                    <p id="totalBooks">
                        0
                    </p>

                </div>


                <!-- Available books -->

                <div class="card">

                    <h3>
                        Available Books
                    </h3>

                    <p id="availableBooks">
                        0
                    </p>

                </div>


                <!-- Borrowed books -->

                <div class="card">

                    <h3>
                        Borrowed Books
                    </h3>

                    <p id="borrowedBooks">
                        0
                    </p>

                </div>


            </div>

        </section>


    </main>



    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>


        /* =================================
           BOOK CATALOGUE DATA
        ================================= */

        const books = [

            {
                title: "Things Fall Apart",
                author: "Chinua Achebe",
                category: "African Literature",
                year: 1958,
                available: true
            },

            {
                title: "The River Between",
                author: "Ngugi wa Thiong'o",
                category: "African Literature",
                year: 1965,
                available: true
            },

            {
                title: "Clean Code",
                author: "Robert C. Martin",
                category: "Technology",
                year: 2008,
                available: true
            },

            {
                title: "The Lean Startup",
                author: "Eric Ries",
                category: "Business",
                year: 2011,
                available: false
            },

            {
                title: "The Great Gatsby",
                author: "F. Scott Fitzgerald",
                category: "Fiction",
                year: 1925,
                available: true
            },

            {
                title: "A Brief History of Time",
                author: "Stephen Hawking",
                category: "Science",
                year: 1988,
                available: false
            }

        ];



        /* =================================
           GET HTML ELEMENTS
        ================================= */

        const searchInput =
            document.getElementById("searchInput");

        const searchButton =
            document.getElementById("searchButton");

        const categoryFilter =
            document.getElementById("categoryFilter");

        const searchResults =
            document.getElementById("searchResults");


        const totalBooks =
            document.getElementById("totalBooks");

        const availableBooks =
            document.getElementById("availableBooks");

        const borrowedBooks =
            document.getElementById("borrowedBooks");



        /* =================================
           UPDATE DASHBOARD
        ================================= */

        function updateDashboard() {

            const total =
                books.length;


            const available =
                books.filter(
                    book => book.available
                ).length;


            const borrowed =
                books.filter(
                    book => !book.available
                ).length;


            totalBooks.textContent =
                total;


            availableBooks.textContent =
                available;


            borrowedBooks.textContent =
                borrowed;

        }



        /* =================================
           DISPLAY BOOKS
        ================================= */

        function displayBooks(bookList) {


            /*
             If there are no matching books
            */

            if (bookList.length === 0) {

                searchResults.innerHTML = `

                    <div class="no-results">

                        <strong>
                            No books found.
                        </strong>

                        <p>
                            Try another title, author,
                            or category.
                        </p>

                    </div>

                `;

                return;

            }


            /*
             Display matching books
            */

            searchResults.innerHTML =

                bookList.map(book => `

                    <div class="book-result">

                        <h3>
                            ${book.title}
                        </h3>


                        <p>

                            <strong>
                                Author:
                            </strong>

                            ${book.author}

                        </p>


                        <p>

                            <strong>
                                Category:
                            </strong>

                            ${book.category}

                        </p>


                        <p>

                            <strong>
                                Year:
                            </strong>

                            ${book.year}

                        </p>


                        <p>

                            <strong>
                                Status:
                            </strong>

                            ${
                                book.available
                                ? "Available"
                                : "Borrowed"
                            }

                        </p>

                    </div>

                `).join("");

        }



        /* =================================
           SEARCH AND FILTER BOOKS
        ================================= */

        function searchBooks() {


            /*
             Get search text
            */

            const searchTerm =

                searchInput.value
                    .toLowerCase()
                    .trim();


            /*
             Get selected category
            */

            const selectedCategory =
                categoryFilter.value;


            /*
             Filter books
            */

            const filteredBooks =

                books.filter(book => {


                    /*
                     Check title
                    */

                    const matchesTitle =

                        book.title
                            .toLowerCase()
                            .includes(searchTerm);


                    /*
                     Check author
                    */

                    const matchesAuthor =

                        book.author
                            .toLowerCase()
                            .includes(searchTerm);


                    /*
                     Check category
                    */

                    const matchesCategory =

                        selectedCategory === "all"

                        ||

                        book.category ===
                        selectedCategory;


                    /*
                     Book must match title
                     or author AND category
                    */

                    return (

                        (matchesTitle ||
                         matchesAuthor)

                        &&

                        matchesCategory

                    );

                });


            /*
             Display results
            */

            displayBooks(filteredBooks);

        }



        /* =================================
           EVENT LISTENERS
        ================================= */


        /*
         Search button
        */

        searchButton.addEventListener(
            "click",
            searchBooks
        );


        /*
         Search while typing
        */

        searchInput.addEventListener(
            "input",
            searchBooks
        );


        /*
         Category filter
        */

        categoryFilter.addEventListener(
            "change",
            searchBooks
        );


        /*
         Allow Enter key to search
        */

        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    searchBooks();

                }

            }
        );



        /* =================================
           INITIAL PAGE LOAD
        ================================= */


        /*
         Display all books
        */

        displayBooks(books);


        /*
         Update dashboard statistics
        */

        updateDashboard();


    </script>


</body>

</html>
