<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Catalogue</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header and Navigation -->
    <header>
        <h1>Library Catalogue</h1>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Books</a>
            <a href="#">Categories</a>
            <a href="#">Borrowing</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Search and Category Filter Section -->
        <section class="search-section">

            <h2>Search Books</h2>

            <!-- Search Input -->
            <input
                type="text"
                id="searchInput"
                placeholder="Search by title or author..."
            >

            <!-- Search Button -->
            <button id="searchButton">Search</button>

            <br><br>

            <!-- Category Filter -->
            <label for="categoryFilter">
                Filter by Category:
            </label>

            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="African Literature">
                    African Literature
                </option>

                <option value="Fiction">
                    Fiction
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Business">
                    Business
                </option>

                <option value="Science">
                    Science
                </option>

            </select>


            <!-- Search Results -->
            <div id="searchResults">
                <p>Enter a book title or author to search.</p>
            </div>

        </section>


        <!-- Dashboard Section -->
        <section class="dashboard">

            <h2>Library Dashboard</h2>

            <div class="dashboard-cards">

                <!-- Total Books -->
                <div class="card">
                    <h3>Total Books</h3>
                    <p id="totalBooks">0</p>
                </div>

                <!-- Available Books -->
                <div class="card">
                    <h3>Available Books</h3>
                    <p id="availableBooks">0</p>
                </div>

                <!-- Borrowed Books -->
                <div class="card">
                    <h3>Borrowed Books</h3>
                    <p id="borrowedBooks">0</p>
                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script type="module">

        // Import the book catalogue
        import books from "./js/books.js";


        // ==============================
        // GET HTML ELEMENTS
        // ==============================

        const searchInput =
            document.getElementById("searchInput");

        const searchButton =
            document.getElementById("searchButton");

        const categoryFilter =
            document.getElementById("categoryFilter");

        const searchResults =
            document.getElementById("searchResults");


        // Dashboard elements
        const totalBooks =
            document.getElementById("totalBooks");

        const availableBooks =
            document.getElementById("availableBooks");

        const borrowedBooks =
            document.getElementById("borrowedBooks");


        // ==============================
        // UPDATE DASHBOARD
        // ==============================

        function updateDashboard() {

            const total = books.length;

            const available =
                books.filter(book => book.available).length;

            const borrowed =
                books.filter(book => !book.available).length;


            totalBooks.textContent = total;

            availableBooks.textContent = available;

            borrowedBooks.textContent = borrowed;
        }


        // ==============================
        // DISPLAY BOOKS
        // ==============================

        function displayBooks(bookList) {

            // If there are no matching books
            if (bookList.length === 0) {

                searchResults.innerHTML = `
                    <p>No books found.</p>
                `;

                return;
            }


            // Display matching books
            searchResults.innerHTML = bookList.map(book => `

                <div class="book-result">

                    <h3>${book.title}</h3>

                    <p>
                        <strong>Author:</strong>
                        ${book.author}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${book.category}
                    </p>

                    <p>
                        <strong>Year:</strong>
                        ${book.year}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${book.available
                            ? "Available"
                            : "Borrowed"}
                    </p>

                </div>

            `).join("");
        }


        // ==============================
        // SEARCH AND CATEGORY FILTER
        // ==============================

        function searchBooks() {

            // Get search text
            const searchTerm =
                searchInput.value
                    .toLowerCase()
                    .trim();


            // Get selected category
            const selectedCategory =
                categoryFilter.value;


            // Filter books
            const filteredBooks = books.filter(book => {

                // Check title
                const matchesTitle =
                    book.title
                        .toLowerCase()
                        .includes(searchTerm);


                // Check author
                const matchesAuthor =
                    book.author
                        .toLowerCase()
                        .includes(searchTerm);


                // Check category
                const matchesCategory =
                    selectedCategory === "all" ||
                    book.category === selectedCategory;


                // Book must match search AND category
                return (
                    (matchesTitle || matchesAuthor) &&
                    matchesCategory
                );

            });


            // Display results
            displayBooks(filteredBooks);
        }


        // ==============================
        // EVENT LISTENERS
        // ==============================

        // Search button
        searchButton.addEventListener(
            "click",
            searchBooks
        );


        // Search while typing
        searchInput.addEventListener(
            "input",
            searchBooks
        );


        // Filter when category changes
        categoryFilter.addEventListener(
            "change",
            searchBooks
        );


        // ==============================
        // INITIAL PAGE LOAD
        // ==============================

        // Display all books
        displayBooks(books);


        // Update dashboard
        updateDashboard();

    </script>

</body>
</html>
