<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Catalogue</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header and Navigation -->
    <header>
        <h1>Library Catalogue</h1>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Books</a>
            <a href="#">Categories</a>
            <a href="#">Borrowing</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Search Section -->
        <section class="search-section">
            <h2>Search Books</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by title or author..."
            >

            <button id="searchButton">Search</button>

            <div id="searchResults">
                <p>Enter a book title or author to search.</p>
            </div>
        </section>


        <!-- Dashboard Section -->
        <section class="dashboard">
            <h2>Library Dashboard</h2>

            <div class="dashboard-cards">

                <div class="card">
                    <h3>Total Books</h3>
                    <p id="totalBooks">6</p>
                </div>

                <div class="card">
                    <h3>Available Books</h3>
                    <p id="availableBooks">6</p>
                </div>

                <div class="card">
                    <h3>Borrowed Books</h3>
                    <p id="borrowedBooks">0</p>
                </div>

            </div>
        </section>

    </main>


    <!-- JavaScript -->
    <script type="module">

        // Import the book catalogue
        import books from "./js/books.js";


        // Get elements from the HTML
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const searchResults = document.getElementById("searchResults");


        // Get dashboard elements
        const totalBooks = document.getElementById("totalBooks");
        const availableBooks = document.getElementById("availableBooks");
        const borrowedBooks = document.getElementById("borrowedBooks");


        // Update dashboard statistics
        function updateDashboard() {

            const total = books.length;

            const available = books.filter(book => book.available).length;

            const borrowed = books.filter(book => !book.available).length;

            totalBooks.textContent = total;
            availableBooks.textContent = available;
            borrowedBooks.textContent = borrowed;
        }


        // Display books on the page
        function displayBooks(bookList) {

            // If no books match the search
            if (bookList.length === 0) {

                searchResults.innerHTML = `
                    <p>No books found.</p>
                `;

                return;
            }


            // Display matching books
            searchResults.innerHTML = bookList.map(book => `

                <div class="book-result">

                    <h3>${book.title}</h3>

                    <p>
                        <strong>Author:</strong>
                        ${book.author}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${book.category}
                    </p>

                    <p>
                        <strong>Year:</strong>
                        ${book.year}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${book.available ? "Available" : "Borrowed"}
                    </p>

                </div>

            `).join("");
        }


        // Search function
        function searchBooks() {

            // Get the text entered by the user
            const searchTerm = searchInput.value
                .toLowerCase()
                .trim();


            // Find books matching title or author
            const filteredBooks = books.filter(book =>

                book.title
                    .toLowerCase()
                    .includes(searchTerm)

                ||

                book.author
                    .toLowerCase()
                    .includes(searchTerm)

            );


            // Display the results
            displayBooks(filteredBooks);
        }


        // Search when the Search button is clicked
        searchButton.addEventListener("click", searchBooks);


        // Also search while the user types
        searchInput.addEventListener("input", searchBooks);


        // Display all books when the page loads
        displayBooks(books);


        // Update dashboard statistics
        updateDashboard();

    </script>

</body>
</html>
